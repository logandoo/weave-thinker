apply plugin: 'com.android.application'

// ============================================
// 服务器地址配置
// 可通过 gradle 参数覆盖: -PserverUrl="http://x.x.x.x:port"
// ============================================
def serverUrl = project.hasProperty('serverUrl')
    ? project.property('serverUrl')
    : 'https://your-server.example:8158'

android {
    namespace "com.weavernote.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.weavernote.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.0.1"

        buildConfigField "String", "SERVER_URL", "\"${serverUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/keystore.jks")
            storePassword "weavernote"
            keyAlias "weavernote"
            keyPassword "weavernote"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.core:core:1.12.0'

    // 统一 kotlin-stdlib 版本，避免 duplicate class 冲突
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'kotlin-stdlib 1.8+ merges jdk7/jdk8 modules'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib 1.8+ merges jdk7/jdk8 modules'
        }
    }
}
